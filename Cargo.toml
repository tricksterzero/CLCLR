[package]
name = "clclr"
version = "1.1.0"
edition = "2024"
description = "Windows clipboard history manager - Rust rewrite of CLCL (nakkag/CLCL)"
license = "MIT"

# exe の名前は CLCLR.exe（パッケージ名は clclr のまま）
[[bin]]
name = "CLCLR"
path = "src/main.rs"

[dependencies]
image-webp = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Diagnostics_Debug",
    "Win32_Globalization",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_Registry",
]

[build-dependencies]
embed-resource = "3.0"

# exe を小さくする（既定より約 12% 小さく、速さは同等か速い）
[profile.release]
lto = "fat"
codegen-units = 1
